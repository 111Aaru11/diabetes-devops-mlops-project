<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diabetes Prediction AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div class="container">

        <div class="main-card">

            <h1 class="title">
                Diabetes Prediction System
            </h1>

            <p class="subtitle">
                AI + DevOps + MLOps Powered Healthcare Platform
            </p>

            <div class="row">

                <div class="col-md-6">

                    <div class="input-group-custom">

                        <label>Pregnancies</label>
                        <input type="number" id="pregnancies" class="form-control">

                    </div>

                    <div class="input-group-custom">

                        <label>Glucose</label>
                        <input type="number" id="glucose" class="form-control">

                    </div>

                    <div class="input-group-custom">

                        <label>Blood Pressure</label>
                        <input type="number" id="blood_pressure" class="form-control">

                    </div>

                    <div class="input-group-custom">

                        <label>Skin Thickness</label>
                        <input type="number" id="skin_thickness" class="form-control">

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="input-group-custom">

                        <label>Insulin</label>
                        <input type="number" id="insulin" class="form-control">

                    </div>

                    <div class="input-group-custom">

                        <label>BMI</label>
                        <input type="number" step="0.1" id="bmi" class="form-control">

                    </div>

                    <div class="input-group-custom">

                        <label>Diabetes Pedigree</label>
                        <input type="number" step="0.01" id="pedigree" class="form-control">

                    </div>

                    <div class="input-group-custom">

                        <label>Age</label>
                        <input type="number" id="age" class="form-control">

                    </div>

                </div>

            </div>

            <div class="text-center">

                <button class="predict-btn" onclick="predictDiabetes()">
                    Predict Now
                </button>

            </div>

            <div class="result-box" id="resultBox">

                Waiting for prediction...

            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
